apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow
  namespace: warfare-argocd-001
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payflow
  template:
    metadata:
      labels:
        app: payflow
    spec:
      containers:
        - name: payflow
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi